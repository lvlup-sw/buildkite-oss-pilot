name: Scaled Buildkite comparison
run-name: Scaled pilot ${{ inputs.trial }} / ${{ inputs.case }}
on:
  workflow_dispatch:
    inputs:
      trial:
        required: true
        type: string
      case:
        required: true
        type: choice
        options: [validation, failure, release, recovery]
permissions:
  contents: read
jobs:
  workload:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run matched workload
        env:
          PILOT_CASE: ${{ inputs.case }}
        run: bash scaled-pilot/run.sh "$PILOT_CASE"
      - name: Retain workload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scaled-pilot-result
          path: report/result.json
          if-no-files-found: error
          retention-days: 7
